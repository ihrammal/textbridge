name: Windows build validation
on:
  workflow_dispatch:
  push:
    branches: [ main, 'codex/release-*' ]
  pull_request:
    branches: [ main, 'codex/release-*' ]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref != 'refs/heads/codex/release-1.1.1'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate source
        shell: pwsh
        run: ./scripts/validate-source.ps1
      - name: Report source version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content ./src/AccessibleOCRStudio/AccessibleOCRStudio.csproj
          Write-Host "Building TextBridge $($csproj.Project.PropertyGroup.Version)"
      - name: Restore and build
        shell: pwsh
        run: dotnet build ./src/AccessibleOCRStudio/AccessibleOCRStudio.csproj -c Release
      - name: Prepare pinned Windows Python
        shell: pwsh
        run: |
          # Security-only CPython versions are not available in setup-python's Windows catalog.
          $archive = Join-Path $env:RUNNER_TEMP 'python312.tar.gz'
          $destination = Join-Path $env:RUNNER_TEMP 'textbridge-python'
          Invoke-WebRequest 'https://github.com/astral-sh/python-build-standalone/releases/download/20260929/cpython-3.12.14%2B20260929-x86_64-pc-windows-msvc-install_only.tar.gz' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '28728BAF30B65E263F0B25C5A85BE8226E7AB0D212FBADD6A8F0F796139FA804') { throw 'Python archive checksum mismatch.' }
          New-Item -ItemType Directory -Force $destination | Out-Null
          tar -xf $archive -C $destination
          if ($LASTEXITCODE -ne 0) { throw 'Python extraction failed.' }
          Join-Path $destination 'python' | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Prepare offline OCR runtime
        shell: pwsh
        run: ./scripts/setup-runtime.ps1
      - name: Run functional tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          ./scripts/test-windows.ps1 *>&1 | Tee-Object artifacts/functional-verification-ci.txt
      - name: Publish win-x64
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Build and verify installer on fresh runner
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1
          ./scripts/test-installer.ps1 -ProductionPackage *>&1 | Tee-Object artifacts/installer-verification-ci.txt
          ./scripts/test-installer.ps1 -ProductionPackage -WindowsOnly *>&1 | Tee-Object artifacts/windows-ocr-installer-verification-ci.txt
          ./scripts/test-installer.ps1 -ProductionPackage -MachineWide -SkipLaunch *>&1 | Tee-Object artifacts/admin-installer-verification-ci.txt
      - name: Upgrade the real published 1.1.0 installation
        shell: pwsh
        run: ./scripts/test-published-upgrade.ps1 *>&1 | Tee-Object artifacts/published-upgrade-verification-ci.txt
      - name: Verify selective models and upgrade preservation
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -SelectiveInstall
          ./scripts/test-selective-installer.ps1 *>&1 | Tee-Object artifacts/selective-installer-verification-ci.txt
      - name: Record the tested artifact hashes
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/AccessibleOCRStudio/AccessibleOCRStudio.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          @{ commit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;version=$version;installerSha256=(Get-FileHash "artifacts/TextBridge-Setup-$version.exe").Hash;applicationSha256=(Get-FileHash publish/TextBridge.dll).Hash } | ConvertTo-Json | Set-Content artifacts/tested-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: TextBridge-win-x64
          path: |
            publish/
            artifacts/TextBridge-Setup-*.exe
            !artifacts/*-QA.exe
            artifacts/tested-build.json
          if-no-files-found: error
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TextBridge-verification
          path: |
            artifacts/*verification-ci.txt
            artifacts/*test.log
          if-no-files-found: warn


  release:
    needs: build
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/codex/release-1.1.1'
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require successful clean-Windows validation on this exact commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow windows-build.yml --branch codex/release-1.1.1-qa --commit $env:GITHUB_SHA --status success --json databaseId,headSha --limit 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or @($runs).Count -ne 1 -or $runs[0].headSha -ne $env:GITHUB_SHA) { throw 'No passing Windows QA run exists for this exact commit.' }
          gh run download $runs[0].databaseId --repo $env:GITHUB_REPOSITORY --name TextBridge-win-x64 --dir .release-build
          if ($LASTEXITCODE -ne 0) { throw 'Unable to obtain the tested build.' }
      - name: Publish tested maintenance release and verify public update feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-tested-release.ps1
